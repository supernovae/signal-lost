name: Propose a door game
description: Suggest a short game for a BBS door. No code needed.
title: 'Door game: '
labels: ['swarm:community']
body:
  - type: markdown
    attributes:
      value: |
        Share your idea in your own words. Maintainers review proposals before they reach the game.
  - type: input
    id: proposal-title
    attributes:
      label: Door game title
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Player goal and actions
      description: What is the player trying to do, and what can they do on each turn?
    validations:
      required: true
  - type: textarea
    id: loop
    attributes:
      label: Feedback and completion
      description: What does the door show after an action? Describe how a run ends or why a player might replay it.
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: How should we credit you?
      description: Give your real contributor credit. Leave blank to use your GitHub handle.
    validations:
      required: false
  - type: checkboxes
    id: original
    attributes:
      label: Original work
      options:
        - label: I wrote this, or have the right to contribute it under this project's MIT license.
          required: true
