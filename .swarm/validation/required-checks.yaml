required_checks:
    - name: build
      command: printf '%s\n' 'Configure project-specific required checks before approving work' >&2; exit 1
      timeout: 5m
    - name: test
      command: printf '%s\n' 'Configure project-specific required checks before approving work' >&2; exit 1
      timeout: 30m
    - name: lint
      command: printf '%s\n' 'Configure project-specific required checks before approving work' >&2; exit 1
      timeout: 5m
protected_paths:
    - .github/workflows/**
    - .swarm/validation/**
    - .swarm/contracts/**
    - .swarm/config.yaml
    - .swarm/prompts/**
    - .swarm/workflows/**
    - .swarm/goals.md
    - .swarm/SKILLS.md
    - .swarm/rules/**
    - .swarm/skills/**
    - .swarm/project.md
    - .swarm/architecture.md
    - .swarm/conventions.md
    - .claude/commands/**
    - .opencode/commands/**
    - AGENTS.md
    - CLAUDE.md
