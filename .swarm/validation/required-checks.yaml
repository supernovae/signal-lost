required_checks:
    - name: format
      command: npm ci --prefer-offline --no-audit --no-fund && npm run format:check
      timeout: 5m
    - name: lint
      command: npm ci --prefer-offline --no-audit --no-fund && npm run lint
      timeout: 5m
    - name: build
      command: npm ci --prefer-offline --no-audit --no-fund && npm run build
      timeout: 5m
    - name: test
      command: npm ci --prefer-offline --no-audit --no-fund && npm test
      timeout: 15m
protected_paths:
    - .github/workflows/**
    - .swarm/validation/**
    - .swarm/contracts/**
    - .swarm/config.yaml
    - .swarm/prompts/**
    - .swarm/workflows/**
    - .swarm/goals.md
    - .swarm/SKILLS.md
    - .swarm/rules/**
    - .swarm/skills/**
    - .swarm/project.md
    - .swarm/architecture.md
    - .swarm/conventions.md
    - .claude/commands/**
    - .opencode/commands/**
    - AGENTS.md
    - CLAUDE.md
